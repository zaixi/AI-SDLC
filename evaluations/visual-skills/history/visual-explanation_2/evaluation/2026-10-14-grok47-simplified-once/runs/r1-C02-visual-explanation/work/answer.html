<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保存体验 · 三种静态状态</title>
  <style>
    :root {
      --background: #f7f5ef;
      --surface: #ffffff;
      --text: #1b2430;
      --muted: #566170;
      --accent: #195dc2;
      --border: #cbd0d6;
      --radius: 6px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 16px;
      --space-4: 24px;
      --font: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.45;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: var(--space-4);
    }

    header {
      margin-bottom: var(--space-4);
    }

    h1 {
      margin: 0 0 var(--space-2);
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .lede {
      margin: 0;
      max-width: 42rem;
      color: var(--muted);
      font-size: 15px;
    }

    .states {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-width: 0;
    }

    .state-name {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
      color: var(--muted);
    }

    .editor {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--border);
      background: var(--background);
    }

    .doc-name {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .save {
      flex: none;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: var(--space-1) var(--space-3);
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.4;
      cursor: pointer;
    }

    .save:enabled {
      background: var(--accent);
      color: #ffffff;
    }

    .save:enabled:hover {
      filter: brightness(1.08);
    }

    .save:enabled:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .save:disabled {
      background: #e7eaee;
      color: var(--muted);
      border-color: var(--border);
      cursor: not-allowed;
      opacity: 1;
    }

    .body {
      margin: 0;
      padding: var(--space-3);
      min-height: 92px;
      color: var(--text);
      font-size: 14px;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .facts {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: var(--space-1);
      font-size: 13px;
    }

    .facts li {
      display: flex;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .facts span {
      color: var(--muted);
    }

    @media (max-width: 720px) {
      main { padding: var(--space-3); }
      .states { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>保存按钮的三种静态状态</h1>
      <p class="lede">同一文档「季度计划」。只展示界面状态，不写入、不联网。</p>
    </header>
    <section class="states" aria-label="三种保存状态">
      <article class="card">
        <h2 class="state-name">未保存</h2>
        <div class="editor">
          <div class="toolbar">
            <p class="doc-name">季度计划</p>
            <button class="save" type="button">保存</button>
          </div>
          <p class="body">本季度目标已改过，尚未写入。</p>
        </div>
        <p class="hint">有未保存修改</p>
        <ul class="facts">
          <li><span>按钮</span><strong>保存</strong></li>
          <li><span>可点击</span><strong>是</strong></li>
        </ul>
      </article>

      <article class="card">
        <h2 class="state-name">保存中</h2>
        <div class="editor">
          <div class="toolbar">
            <p class="doc-name">季度计划</p>
            <button class="save" type="button" disabled>保存中…</button>
          </div>
          <p class="body">本季度目标已改过，正在写入。</p>
        </div>
        <p class="hint">正在写入</p>
        <ul class="facts">
          <li><span>按钮</span><strong>保存中…</strong></li>
          <li><span>可点击</span><strong>否</strong></li>
        </ul>
      </article>

      <article class="card">
        <h2 class="state-name">已保存</h2>
        <div class="editor">
          <div class="toolbar">
            <p class="doc-name">季度计划</p>
            <button class="save" type="button" disabled>已保存</button>
          </div>
          <p class="body">本季度目标与已写入内容一致。</p>
        </div>
        <p class="hint">修改已保存</p>
        <ul class="facts">
          <li><span>按钮</span><strong>已保存</strong></li>
          <li><span>可点击</span><strong>否</strong></li>
        </ul>
      </article>
    </section>
  </main>
</body>
</html>
