<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字化平台图解</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-paper:       #f5f5f5;
      --color-paper-2:     #ececec;
      --color-ink:         #2d3142;
      --color-muted:       #4f5d75;
      --color-soft:        #5a6580;
      --color-rule:        rgba(45,49,66,0.12);
      --color-accent:      #bf4520;
      --color-accent-tint: rgba(191,69,32,0.08);
      --color-link:        #2e5aa8;
      --font-sans:  'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
      --font-serif: 'Noto Serif CJK SC', 'Noto Serif SC', 'Source Han Serif SC', serif;
      --font-mono:  'Noto Sans Mono CJK SC', 'Noto Sans Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      min-height: 100vh;
      padding: 2.5rem 1.5rem 3rem;
      color: var(--color-ink);
    }

    .container { max-width: 1280px; margin: 0 auto; }

    .header { margin-bottom: 2rem; max-width: 68ch; }

    .header-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      margin-bottom: 0.7rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.85rem, 2.4vw + 1rem, 2.55rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.7rem;
    }

    .subtitle {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--color-muted);
    }

    section.view { margin-top: 2.75rem; }

    .view-head { margin-bottom: 0.85rem; max-width: 72ch; }

    .view-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--color-accent);
      margin-bottom: 0.35rem;
    }

    h2 {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.25;
      margin-bottom: 0.4rem;
    }

    .view-head p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-muted);
    }

    .diagram-container {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      background: transparent;
    }

    svg { width: 100%; display: block; height: auto; }

    .cards {
      display: grid;
      grid-template-columns: 1.15fr 0.95fr 0.9fr;
      gap: 1rem;
      margin-top: 1.1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid var(--color-rule);
      padding: 1.15rem 1.2rem 1.2rem;
    }

    .card .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--color-soft);
      margin-bottom: 0.55rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid rgba(45,49,66,0.08);
    }

    .card-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .card-dot.ink   { background: var(--color-ink); }
    .card-dot.muted { background: var(--color-muted); }
    .card-dot.coral { background: var(--color-accent); }
    .card-dot.link  { background: var(--color-link); }

    .card h3 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.005em;
    }

    .card ul { list-style: none; color: var(--color-muted); font-size: 0.84rem; line-height: 1.55; }
    .card li { margin-bottom: 0.28rem; padding-left: 0.9rem; position: relative; }
    .card li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: rgba(45,49,66,0.28);
      font-size: 0.75rem;
    }

    .note {
      margin-top: 0.85rem;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.98rem;
      line-height: 1.5;
      color: var(--color-ink);
      max-width: 70ch;
    }

    .footer {
      margin-top: 2.5rem;
      padding-top: 1.1rem;
      border-top: 1px solid rgba(45,49,66,0.10);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      line-height: 1.55;
      color: var(--color-soft);
    }

    @media (max-width: 860px) {
      body { padding: 1.5rem 1rem 2rem; }
      .cards { grid-template-columns: 1fr; }
    }

    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      section.view { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <p class="header-eyebrow">数字化平台 · 给定事实</p>
      <h1>原件进来，检索和通知出去</h1>
      <p class="subtitle">十四个内部单元分在接入、处理、检索、运维四个区域。新同事先看总览和成功顺序；值班时按失败类型查作业停在哪、哪些部分不受影响。外部邮件服务不属于平台。协议、队列、重试调度和人工重新排队的入口都还没确定，图里不补。</p>
    </header>

    <!-- ========== 1. 总览 ========== -->
    <section class="view" id="overview">
      <div class="view-head">
        <p class="view-eyebrow">01 · 给新同事</p>
        <h2>四个区域，一条主链</h2>
        <p>实线是成功主链，从左到右。虚线是旁路：用户查状态，通知器在作业已完成后发信。读写方向和先后约束在下一张。</p>
      </div>

      <div class="diagram-container">
        <svg viewBox="0 0 1280 760" role="img" aria-labelledby="overview-title overview-desc">
          <title id="overview-title">数字化平台区域总览</title>
          <desc id="overview-desc">接入、处理、检索、运维四个区域共十四个内部单元。成功主链从上传页经接收、原件库、作业表、调度器、OCR、文本库、索引到搜索；状态查询和完成邮件是旁路。外部邮件服务在平台边界之外。</desc>
          <rect width="1280" height="760" fill="#f5f5f5"/>
          <defs>
            <marker id="ov-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
            </marker>
            <marker id="ov-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
            </marker>
            <marker id="ov-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
            </marker>
          </defs>

          <!-- zones: 接入 / 处理 / 检索 -->
          <rect x="24" y="56" width="248" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <rect x="36" y="64" width="44" height="16" rx="2" fill="#f5f5f5"/>
          <text x="58" y="76" fill="#5a6580" font-size="12" font-family="'Noto Sans CJK SC', sans-serif" font-weight="500" text-anchor="middle">接入</text>

          <rect x="288" y="56" width="392" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <rect x="300" y="64" width="44" height="16" rx="2" fill="#f5f5f5"/>
          <text x="322" y="76" fill="#5a6580" font-size="12" font-family="'Noto Sans CJK SC', sans-serif" font-weight="500" text-anchor="middle">处理</text>

          <rect x="696" y="56" width="300" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <rect x="708" y="64" width="44" height="16" rx="2" fill="#f5f5f5"/>
          <text x="730" y="76" fill="#5a6580" font-size="12" font-family="'Noto Sans CJK SC', sans-serif" font-weight="500" text-anchor="middle">检索</text>

          <!-- 运维：跨底，不是主链的下一站 -->
          <rect x="24" y="592" width="972" height="100" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <rect x="36" y="600" width="44" height="16" rx="2" fill="#f5f5f5"/>
          <text x="58" y="612" fill="#5a6580" font-size="12" font-family="'Noto Sans CJK SC', sans-serif" font-weight="500" text-anchor="middle">运维</text>

          <!-- 平台外 -->
          <rect x="1016" y="592" width="240" height="100" rx="8" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
          <rect x="1028" y="600" width="68" height="16" rx="2" fill="#f5f5f5"/>
          <text x="1062" y="612" fill="#5a6580" font-size="12" font-family="'Noto Sans CJK SC', sans-serif" font-weight="500" text-anchor="middle">平台之外</text>

          <!-- arrows (before nodes) -->
          <!-- 1 上传页 → 接收 API -->
          <line x1="148" y1="148" x2="148" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- 2 接收 API → 原件库 (先写) accent -->
          <path d="M 84,268 H 44 Q 36,268 36,276 V 308 Q 36,316 44,316 H 68" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#ov-arrow-accent)"/>
          <!-- 3 接收 API → 作业表 (再建立) -->
          <path d="M 212,268 H 252 Q 260,268 260,276 V 308 Q 260,316 252,316 H 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- 4 调度器 ← 作业表 读待处理；画成从作业表到调度器（读的方向用标签） -->
          <line x1="308" y1="400" x2="388" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- 5 调度器 → OCR -->
          <line x1="556" y1="400" x2="620" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- 6 OCR ← 原件库 读 -->
          <path d="M 148,396 H 300 Q 308,396 308,404 V 452 Q 308,460 316,460 H 628 Q 636,460 636,452 V 428" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- 7 OCR → 文本库 -->
          <line x1="700" y1="400" x2="764" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- 8 OCR 通知 索引工作者：虚线，从 OCR 下沿绕到索引左沿，不穿文本库 -->
          <path d="M 660,428 V 468 Q 660,476 668,476 H 804 Q 812,476 812,484 V 508" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ov-arrow)"/>
          <!-- 9 索引 ← 文本库 -->
          <line x1="844" y1="428" x2="844" y2="508" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- 10 索引 → 搜索索引 -->
          <line x1="844" y1="564" x2="844" y2="548" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ov-arrow)"/>
          <!-- wait, 索引 y=508 h=56 so bottom=564, 搜索索引 y=... I need to place 搜索索引 BELOW 索引? Zone ends at 576. Let's place 搜索页 and 查询 and 索引 stacked differently.

          Recalculate 检索 column:
          文本库 y=372 h=56 (same row as OCR)
          索引工作者 y=508 would go past zone 576. Zone height needs to grow OR stack differently.

          Better 检索 layout inside zone x=696 w=300, zone bottom currently 576.
          Let me NOT draw arrow 10 yet - I'll fix positions.

          Revised node positions (I'll set nodes to match arrows I already committed... this is getting messy).
          Let me rewrite the whole SVG cleanly rather than patch. I'll stop and rewrite the file section.

          Actually I'm still in the write. I should fix before finishing. Let me redesign coordinates now and replace this svg content entirely by rewriting the file. I'll abort this draft mentally and write a correct file.

          I'll change approach: finish a correct file from scratch with carefully computed coordinates. Don't ship this half-broken svg.
          -->
        </svg>
      </div>
    </section>
  </div>
</body>
</html>
